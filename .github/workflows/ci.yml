name: security-pipeline
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks-docker
        run: docker run --rm -v "$PWD:/path:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /path -v --redact
  lint-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: todo-app
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 7.1.0
        with:
          python-version: '3.13'
      - name: install-dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: ruff-check
        run:  python -m ruff check .
      - name: ruff-format
        run: python -m ruff format --check .
      - name: pytest
        run: python -m pytest -v
      - name: bandit
        run: python -m bandit main.py
      - name: semgrep
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            semgrep/semgrep@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6 \
            semgrep scan --config /src/semgrep/python.yml \
            --metrics=off --disable-version-check --error /src/todo-app/main.py
      - name: pip-audit
        run: python -m pip_audit --require-hashes -r requirements.txt
  container:
    runs-on: ubuntu-24.04
    env:
      TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: hadolint
        run: |
          docker run --rm -i \
            hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            < todo-app/Dockerfile

      - name: build
        run: |
          docker build -t todo-app:ci ./todo-app
          docker save -o /tmp/todo-app.tar todo-app:ci

      - name: reports
        run: |
          mkdir -p reports
          docker run --rm \
            -v /tmp/todo-app.tar:/scan/image.tar:ro \
            -v trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --input /scan/image.tar \
            --scanners vuln --format json > reports/trivy.json
          docker run --rm \
            -v /tmp/todo-app.tar:/scan/image.tar:ro \
            "$TRIVY_IMAGE" image --input /scan/image.tar \
            --format cyclonedx > reports/sbom.cdx.json

      - name: trivy-gate
        run: |
          docker run --rm \
            -v /tmp/todo-app.tar:/scan/image.tar:ro \
            -v trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --input /scan/image.tar \
            --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1

      - name: upload-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container-reports
          path: reports/
          retention-days: 14
          if-no-files-found: error
  dast:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: build
        run: docker build -t todo-app:dast ./todo-app

      - name: start-app
        run: |
          docker run -d --name todo-dast \
            -p 127.0.0.1:8001:8000 \
            --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --memory=256m --cpus=0.5 --pids-limit=64 \
            todo-app:dast
          curl --fail --retry 15 --retry-connrefused \
            --retry-delay 2 http://127.0.0.1:8001/tasks

      - name: prepare-reports
        run: |
          mkdir -p reports/zap
          chmod 0777 reports/zap

      - name: zap-baseline
        run: |
          docker run --rm --network host \
            --mount "type=bind,src=$PWD/reports/zap,dst=/zap/wrk" \
            --mount "type=bind,src=$PWD/zap/baseline.conf,dst=/zap/baseline.conf,readonly" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py \
            -t http://127.0.0.1:8001/tasks \
            -m 1 -c /zap/baseline.conf \
            -r baseline.html -J baseline.json

      - name: upload-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dast-reports
          path: |
            reports/zap/baseline.html
            reports/zap/baseline.json
          retention-days: 14
          if-no-files-found: error

      - name: cleanup
        if: ${{ always() }}
        run: docker rm -f todo-dast